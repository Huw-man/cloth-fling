[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cloth-fling"
version = "0.2.0"
description = "Robotless cloth unfolding experiments with explicit assisted grasps"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "pillow>=10,<13", "pyarrow>=18,<24"]

[project.optional-dependencies]
train = ["torch>=2.7,<3"]
sim = ["genesis-world==1.4.4", "torch>=2.7,<3", "trimesh>=4.8.2,<5"]
video = ["imageio>=2.36,<3", "imageio-ffmpeg>=0.6,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cloth-fling = "cloth_fling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloth_fling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires Genesis and an available CUDA GPU"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", extra = "sim" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
